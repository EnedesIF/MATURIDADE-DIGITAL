<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatório ABDI — Maturidade Digital IFB</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --verde:       #2d7a3d;
    --verde-m:     #3a9e4f;
    --verde-l:     #eaf5ec;
    --azul:        #1a4b8c;
    --azul-m:      #2563eb;
    --azul-l:      #eff6ff;
    --amarelo:     #b45309;
    --amarelo-l:   #fef9ec;
    --vermelho:    #c0392b;
    --vermelho-l:  #fef2f2;
    --roxo:        #5b21b6;
    --roxo-l:      #f5f3ff;
    --cinza-escuro:#111827;
    --cinza:       #374151;
    --cinza-m:     #6b7280;
    --cinza-l:     #f3f4f6;
    --borda:       #e5e7eb;
    --branco:      #ffffff;
    --sombra:      0 1px 3px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.06);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Sora', sans-serif;
    background: #f0f4f8;
    color: var(--cinza-escuro);
    min-height: 100vh;
  }

  /* ── LOADING ── */
  #loading {
    position: fixed; inset: 0; background: var(--branco);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 9999; gap: 16px;
  }
  .spinner {
    width: 44px; height: 44px;
    border: 3px solid var(--borda);
    border-top-color: var(--verde-m);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading p { font-size: 14px; color: var(--cinza-m); }

  /* ── FILTROS TOPO ── */
  #filtros-wrap {
    background: var(--branco);
    border-bottom: 1px solid var(--borda);
    padding: 12px 32px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  #filtros-wrap label { font-size: 12px; font-weight: 600; color: var(--cinza-m); text-transform: uppercase; letter-spacing: .05em; }
  #filtros-wrap select {
    font-family: 'Sora', sans-serif;
    font-size: 13px; padding: 6px 12px;
    border: 1px solid var(--borda); border-radius: 6px;
    background: var(--cinza-l); color: var(--cinza-escuro);
    cursor: pointer;
  }
  #filtros-wrap select:focus { outline: none; border-color: var(--verde-m); }
  .btn-print {
    margin-left: auto;
    background: var(--verde-m); color: #fff;
    border: none; border-radius: 6px;
    padding: 7px 18px; font-size: 13px; font-weight: 600;
    font-family: 'Sora', sans-serif; cursor: pointer;
    display: flex; align-items: center; gap: 6px;
  }
  .btn-print:hover { background: var(--verde); }

  /* ── MAIN ── */
  .relatorio { max-width: 1100px; margin: 0 auto; padding: 32px 24px 60px; }

  /* ── HEADER ── */
  .header-bloco {
    background: linear-gradient(135deg, #0f3460 0%, #1a4b8c 50%, #2563eb 100%);
    border-radius: 16px; padding: 36px 40px;
    color: #fff; margin-bottom: 28px;
    position: relative; overflow: hidden;
  }
  .header-bloco::before {
    content: '';
    position: absolute; top: -60px; right: -60px;
    width: 240px; height: 240px;
    background: rgba(255,255,255,.06);
    border-radius: 50%;
  }
  .header-bloco::after {
    content: '';
    position: absolute; bottom: -80px; right: 120px;
    width: 180px; height: 180px;
    background: rgba(255,255,255,.04);
    border-radius: 50%;
  }
  .header-logo { font-size: 11px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; opacity: .7; margin-bottom: 8px; }
  .header-title { font-size: 28px; font-weight: 800; line-height: 1.2; margin-bottom: 6px; }
  .header-sub { font-size: 14px; opacity: .75; }
  .header-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.25);
    border-radius: 20px; padding: 4px 14px; font-size: 12px; font-weight: 600;
    margin-top: 16px;
  }

  /* ── KPIs ── */
  .kpis-grid {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px;
    margin-bottom: 28px;
  }
  .kpi-card {
    background: var(--branco); border-radius: 12px;
    padding: 20px 18px; box-shadow: var(--sombra);
    border-top: 3px solid transparent;
    transition: transform .2s;
  }
  .kpi-card:hover { transform: translateY(-2px); }
  .kpi-card.verde  { border-top-color: var(--verde-m); }
  .kpi-card.azul   { border-top-color: var(--azul-m); }
  .kpi-card.amarelo{ border-top-color: #f59e0b; }
  .kpi-card.roxo   { border-top-color: #8b5cf6; }
  .kpi-card.destaque{ border-top-color: #10b981; background: #ecfdf5; }
  .kpi-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--cinza-m); margin-bottom: 8px; }
  .kpi-valor { font-size: 32px; font-weight: 800; line-height: 1; }
  .kpi-valor.verde  { color: var(--verde-m); }
  .kpi-valor.azul   { color: var(--azul-m); }
  .kpi-valor.amarelo{ color: #f59e0b; }
  .kpi-valor.roxo   { color: #8b5cf6; }
  .kpi-valor.destaque{ color: #059669; }
  .kpi-desc { font-size: 11px; color: var(--cinza-m); margin-top: 6px; line-height: 1.4; }

  /* ── SECAO ── */
  .secao { margin-bottom: 28px; }
  .secao-titulo {
    font-size: 13px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .08em; color: var(--cinza-m);
    margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .secao-titulo::after { content: ''; flex: 1; height: 1px; background: var(--borda); }

  /* ── FORMULA ABDI ── */
  .formula-card {
    background: var(--branco); border-radius: 12px; padding: 24px 28px;
    box-shadow: var(--sombra); border-left: 4px solid var(--azul-m);
  }
  .formula-titulo { font-size: 14px; font-weight: 700; color: var(--azul); margin-bottom: 16px; }
  .formula-box {
    background: var(--azul-l); border-radius: 8px; padding: 14px 20px;
    font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600;
    color: var(--azul); margin-bottom: 14px;
  }
  .formula-passos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 14px; }
  .passo {
    background: var(--cinza-l); border-radius: 8px; padding: 12px 14px;
    text-align: center;
  }
  .passo-num { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--cinza-m); margin-bottom: 4px; }
  .passo-val { font-size: 18px; font-weight: 800; color: var(--cinza-escuro); }
  .passo-desc { font-size: 11px; color: var(--cinza-m); margin-top: 2px; }
  .resultado-abdi {
    margin-top: 16px;
    background: linear-gradient(135deg, #ecfdf5, #d1fae5);
    border: 1px solid #6ee7b7;
    border-radius: 8px; padding: 14px 20px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .resultado-abdi .res-label { font-size: 13px; font-weight: 600; color: #065f46; }
  .resultado-abdi .res-val   { font-size: 26px; font-weight: 800; color: #059669; }
  .resultado-abdi .res-meta  { font-size: 12px; color: #047857; }

  /* ── COMPARATIVO SCORES ── */
  .comp-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  .comp-card {
    background: var(--branco); border-radius: 12px; padding: 24px;
    box-shadow: var(--sombra); text-align: center;
  }
  .comp-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--cinza-m); margin-bottom: 10px; }
  .comp-antes { font-size: 36px; font-weight: 800; color: #ef4444; }
  .comp-depois { font-size: 36px; font-weight: 800; color: #10b981; }
  .comp-evolucao { font-size: 36px; font-weight: 800; color: var(--azul-m); }
  .comp-sub { font-size: 12px; color: var(--cinza-m); margin-top: 4px; }
  .arrow-evolucao {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    margin-top: 12px;
  }
  .arrow-evolucao .seta { font-size: 20px; }

  /* ── BARRAS COMPARATIVAS ── */
  .barra-comp-wrap { background: var(--branco); border-radius: 12px; padding: 24px 28px; box-shadow: var(--sombra); }
  .barra-row { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .barra-row:last-child { margin-bottom: 0; }
  .barra-label { width: 130px; font-size: 12px; font-weight: 600; color: var(--cinza-escuro); flex-shrink: 0; }
  .barra-tracks { flex: 1; display: flex; flex-direction: column; gap: 5px; }
  .barra-track { height: 14px; border-radius: 8px; background: var(--cinza-l); position: relative; overflow: hidden; }
  .barra-fill-antes  { height: 100%; border-radius: 8px; background: linear-gradient(90deg, #fca5a5, #ef4444); transition: width 1s ease; }
  .barra-fill-depois { height: 100%; border-radius: 8px; background: linear-gradient(90deg, #6ee7b7, #10b981); transition: width 1s ease; }
  .barra-vals { width: 90px; text-align: right; flex-shrink: 0; }
  .barra-val-antes  { font-size: 11px; color: #ef4444; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
  .barra-val-depois { font-size: 11px; color: #10b981; font-weight: 700; font-family: 'JetBrains Mono', monospace; }

  /* ── NIVEIS ── */
  .niveis-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .nivel-card {
    background: var(--branco); border-radius: 12px; padding: 18px;
    box-shadow: var(--sombra); text-align: center;
  }
  .nivel-nome { font-size: 13px; font-weight: 700; margin-bottom: 14px; }
  .nivel-antes-depois {
    display: flex; justify-content: space-around; gap: 8px; margin-bottom: 10px;
  }
  .nivel-num { text-align: center; }
  .nivel-num .val { font-size: 28px; font-weight: 800; line-height: 1; }
  .nivel-num .sub { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; margin-top: 2px; }
  .nivel-num.antes .val  { color: #ef4444; }
  .nivel-num.antes .sub  { color: #ef4444; opacity: .7; }
  .nivel-num.depois .val { color: #10b981; }
  .nivel-num.depois .sub { color: #10b981; opacity: .7; }
  .nivel-variacao { font-size: 13px; font-weight: 700; }
  .nivel-variacao.positivo { color: #10b981; }
  .nivel-variacao.negativo { color: #ef4444; }
  .nivel-variacao.neutro   { color: var(--cinza-m); }

  /* ── CHARTS ── */
  .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .chart-card {
    background: var(--branco); border-radius: 12px; padding: 22px;
    box-shadow: var(--sombra);
  }
  .chart-titulo { font-size: 13px; font-weight: 700; color: var(--cinza-escuro); margin-bottom: 16px; }
  .chart-wrap { position: relative; height: 220px; }

  /* ── RANKING ── */
  .ranking-card { background: var(--branco); border-radius: 12px; padding: 24px; box-shadow: var(--sombra); }
  .ranking-header {
    display: grid; grid-template-columns: 40px 1fr 90px 90px 80px 120px 120px;
    gap: 8px; padding: 0 8px 10px; border-bottom: 2px solid var(--borda);
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .07em; color: var(--cinza-m);
  }
  .ranking-row {
    display: grid; grid-template-columns: 40px 1fr 90px 90px 80px 120px 120px;
    gap: 8px; padding: 10px 8px;
    border-bottom: 1px solid var(--borda);
    align-items: center; font-size: 13px;
    transition: background .15s;
  }
  .ranking-row:last-child { border-bottom: none; }
  .ranking-row:hover { background: var(--cinza-l); border-radius: 8px; }
  .rank-pos { font-weight: 800; color: var(--cinza-m); font-size: 14px; text-align: center; }
  .rank-pos.top3 { color: var(--verde-m); }
  .rank-nome { font-weight: 600; font-size: 12px; }
  .rank-score { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; text-align: center; }
  .rank-score.antes  { color: #ef4444; }
  .rank-score.depois { color: #10b981; }
  .rank-evolucao {
    font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700;
    color: var(--azul-m); text-align: center;
  }
  .tag-nivel {
    display: inline-block; padding: 3px 10px; border-radius: 20px;
    font-size: 10px; font-weight: 700; text-align: center;
  }
  .nivel-inicial       { background: #fef2f2; color: #c0392b; }
  .nivel-basico        { background: #fef9ec; color: #b45309; }
  .nivel-intermediario { background: var(--azul-l); color: var(--azul); }
  .nivel-avancado      { background: var(--verde-l); color: var(--verde); }
  .nivel-em-desenvolvimento { background: #fef9ec; color: #b45309; }
  .nivel-em-transicao  { background: var(--azul-l); color: var(--azul); }
  .nivel-digitalmente-ativo { background: var(--verde-l); color: var(--verde); }
  .nivel-referencia-digital { background: var(--roxo-l); color: var(--roxo); }
  .nivel-iniciante-digital  { background: #fef2f2; color: #c0392b; }

  /* ── CONQUISTAS ── */
  .conquistas-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .conquista-item {
    background: var(--branco); border-radius: 10px; padding: 14px 16px;
    box-shadow: var(--sombra); display: flex; align-items: flex-start; gap: 10px;
  }
  .conquista-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
  .conquista-text { font-size: 13px; color: var(--cinza); line-height: 1.5; }
  .conquista-text strong { color: var(--cinza-escuro); }

  /* ── METODOLOGIA ── */
  .metod-card { background: var(--branco); border-radius: 12px; padding: 24px; box-shadow: var(--sombra); }
  .metod-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 16px; }
  .metod-item { padding: 14px; background: var(--cinza-l); border-radius: 8px; }
  .metod-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--cinza-m); margin-bottom: 4px; }
  .metod-val { font-size: 13px; color: var(--cinza-escuro); font-weight: 500; }

  /* ── FOOTER ── */
  .footer {
    text-align: center; font-size: 11px; color: var(--cinza-m);
    margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--borda);
  }

  /* ── LEGENDA ── */
  .legenda { display: flex; gap: 20px; margin-bottom: 10px; }
  .legenda-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--cinza-m); }
  .legenda-dot { width: 10px; height: 10px; border-radius: 50%; }
  .legenda-dot.antes  { background: #ef4444; }
  .legenda-dot.depois { background: #10b981; }

  /* ── PRINT ── */
  @media print {
    body { background: white; }
    #filtros-wrap { display: none; }
    .relatorio { max-width: 100%; padding: 20px; }
    .kpi-card:hover, .ranking-row:hover { transform: none; background: transparent; }
    .header-bloco { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .btn-print { display: none; }
  }

  @media (max-width: 768px) {
    .kpis-grid { grid-template-columns: repeat(2, 1fr); }
    .charts-grid { grid-template-columns: 1fr; }
    .niveis-grid { grid-template-columns: repeat(2, 1fr); }
    .conquistas-grid { grid-template-columns: 1fr; }
    .formula-passos { grid-template-columns: repeat(2, 1fr); }
    .comp-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <p>Carregando dados do Supabase…</p>
</div>

<div id="app" style="display:none;">

  <!-- Filtros -->
  <div id="filtros-wrap">
    <label>Turma / Curso:</label>
    <select id="filtro-turma" onchange="renderRelatorio()">
      <option value="">Todas as turmas</option>
    </select>
    <button class="btn-print" onclick="window.print()">
      🖨️ Imprimir / PDF
    </button>
  </div>

  <div class="relatorio" id="relatorio-content">
    <!-- gerado por JS -->
  </div>

</div>

<script>
const SUPA_URL  = 'https://mbclrqyetdakitljwfos.supabase.co';
const SUPA_ANON = 'sb_publishable_kSWiiwIrDWInbr5tywIG0g_8Kwpzr_-';
const supa = supabase.createClient(SUPA_URL, SUPA_ANON);

const NIVEIS_NOMES = ['Iniciante Digital','Em Desenvolvimento','Em Transição','Digitalmente Ativo','Referência Digital'];
const NIVEIS_CORES = ['#ef4444','#f59e0b','#3b82f6','#10b981','#8b5cf6'];
const DIMS_NOMES   = ['Atendimento','Financeiro','Marketing','Gestão','Confiança'];

let TODOS = [];
let chartRadar = null, chartNiveis = null, chartEvol = null;

function nomeNivel(n) { return NIVEIS_NOMES[n] || '—'; }

function slugNivel(nome) {
  const m = {
    'Iniciante Digital': 'iniciante-digital',
    'Em Desenvolvimento': 'em-desenvolvimento',
    'Em Transição': 'em-transicao',
    'Digitalmente Ativo': 'digitalmente-ativo',
    'Referência Digital': 'referencia-digital',
    'Inicial': 'inicial', 'Básico': 'basico',
    'Intermediário': 'intermediario', 'Avançado': 'avancado',
  };
  return m[nome] || 'basico';
}

function fmt(n, dec=2) { return n == null ? '—' : Number(n).toFixed(dec); }

async function carregar() {
  const { data, error } = await supa
    .from('respostas')
    .select('*')
    .order('criado_em', { ascending: false });

  if (error) {
    document.getElementById('loading').innerHTML =
      '<p style="color:red">Erro ao carregar dados: ' + error.message + '</p>';
    return;
  }

  TODOS = data || [];

  // Popula filtro de turma
  const turmas = [...new Set(TODOS.map(r => r.turma).filter(Boolean))].sort();
  const sel = document.getElementById('filtro-turma');
  turmas.forEach(t => {
    const op = document.createElement('option');
    op.value = t; op.textContent = t;
    sel.appendChild(op);
  });

  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  renderRelatorio();
}

function filtrar() {
  const turma = document.getElementById('filtro-turma').value;
  let dados = TODOS;
  if (turma) dados = dados.filter(r => r.turma === turma);
  return dados;
}

function calcMetricas(dados) {
  const antes  = dados.filter(r => r.momento === 'antes');
  const depois = dados.filter(r => r.momento === 'depois');

  const avgAntes  = antes.length  ? antes.reduce((a,r)=>a+r.score_total,0)/antes.length  : 0;
  const avgDepois = depois.length ? depois.reduce((a,r)=>a+r.score_total,0)/depois.length : 0;
  const evolucao  = avgAntes > 0  ? ((avgDepois - avgAntes) / avgAntes) * 100 : 0;
  const evMedia   = avgDepois - avgAntes;

  // IMD da fórmula ABDI
  const imd = avgAntes > 0 ? ((avgDepois - avgAntes) / avgAntes) * 100 : 0;
  const atingimento = (imd / 30) * 100;

  // Mudaram de nível (pareia por nome+turma)
  const mapaAntes = {};
  antes.forEach(r => { const k = (r.nome||'') + '|' + (r.turma||''); mapaAntes[k] = r; });
  let mudaram = 0;
  depois.forEach(r => {
    const k = (r.nome||'') + '|' + (r.turma||'');
    if (mapaAntes[k] && mapaAntes[k].nivel !== r.nivel) mudaram++;
  });

  // Distribuição de níveis
  const distAntes  = [0,1,2,3,4].map(n => antes.filter(r=>r.nivel===n).length);
  const distDepois = [0,1,2,3,4].map(n => depois.filter(r=>r.nivel===n).length);

  // Médias por dimensão
  const dims = ['dim_atendimento','dim_financeiro','dim_marketing','dim_gestao','dim_confianca'];
  const avgDimAntes  = dims.map(d => antes.length  ? antes.reduce((a,r)=>a+(r[d]||0),0)/antes.length  : 0);
  const avgDimDepois = dims.map(d => depois.length ? depois.reduce((a,r)=>a+(r[d]||0),0)/depois.length : 0);

  // Ranking: pareados
  const rankList = [];
  depois.forEach(r => {
    const k = (r.nome||'') + '|' + (r.turma||'');
    const ra = mapaAntes[k];
    if (ra) rankList.push({
      nome: r.nome, turma: r.turma,
      antes: ra.score_total, depois: r.score_total,
      evolucao: r.score_total - ra.score_total,
      nivelAntes: nomeNivel(ra.nivel),
      nivelDepois: nomeNivel(r.nivel),
    });
  });
  rankList.sort((a,b) => b.evolucao - a.evolucao);

  return { antes, depois, avgAntes, avgDepois, evolucao, evMedia, imd, atingimento,
           mudaram, distAntes, distDepois, avgDimAntes, avgDimDepois, rankList };
}

function renderRelatorio() {
  const dados = filtrar();
  const m = calcMetricas(dados);
  const el = document.getElementById('relatorio-content');
  el.innerHTML = buildHTML(m, dados);
  renderCharts(m);
}

function buildHTML(m, dados) {
  const turma = document.getElementById('filtro-turma').value;
  const hoje  = new Date().toLocaleDateString('pt-BR', {day:'2-digit',month:'long',year:'numeric'});

  const imdClass = m.imd >= 30 ? 'destaque' : 'amarelo';
  const imdIcon  = m.imd >= 30 ? '🏆' : '📈';

  // ── NÍVEIS VARIAÇÃO
  const niveisLabels = NIVEIS_NOMES;
  const niveisRows = niveisLabels.map((nome, i) => {
    const a = m.distAntes[i], d = m.distDepois[i], v = d - a;
    const pct = a > 0 ? ((v/a)*100).toFixed(1) : (d > 0 ? '+100' : '0');
    const cls = v > 0 ? 'positivo' : v < 0 ? 'negativo' : 'neutro';
    const sinal = v > 0 ? '+' : '';
    return `
      <div class="nivel-card">
        <div class="nivel-nome" style="color:${NIVEIS_CORES[i]}">${nome}</div>
        <div class="nivel-antes-depois">
          <div class="nivel-num antes">
            <div class="val">${a}</div>
            <div class="sub">Antes</div>
          </div>
          <div style="font-size:20px;line-height:1;color:var(--cinza-m);align-self:center;">→</div>
          <div class="nivel-num depois">
            <div class="val">${d}</div>
            <div class="sub">Depois</div>
          </div>
        </div>
        <div class="nivel-variacao ${cls}">${sinal}${v} (${sinal}${pct}%)</div>
      </div>`;
  }).join('');

  // ── BARRAS DIMENSÕES
  const maxDim = 8;
  const barrasRows = DIMS_NOMES.map((nome, i) => {
    const a = m.avgDimAntes[i].toFixed(1);
    const d = m.avgDimDepois[i].toFixed(1);
    const pa = (m.avgDimAntes[i]/maxDim*100).toFixed(1);
    const pd = (m.avgDimDepois[i]/maxDim*100).toFixed(1);
    return `
      <div class="barra-row">
        <div class="barra-label">${nome}</div>
        <div class="barra-tracks">
          <div class="barra-track"><div class="barra-fill-antes" style="width:${pa}%"></div></div>
          <div class="barra-track"><div class="barra-fill-depois" style="width:${pd}%"></div></div>
        </div>
        <div class="barra-vals">
          <div class="barra-val-antes">${a}</div>
          <div class="barra-val-depois">${d}</div>
        </div>
      </div>`;
  }).join('');

  // ── RANKING (top 20)
  const rankRows = m.rankList.slice(0,20).map((r, i) => `
    <div class="ranking-row">
      <div class="rank-pos ${i<3?'top3':''}">${i+1}</div>
      <div class="rank-nome">${r.nome || '—'}</div>
      <div class="rank-score antes">${fmt(r.antes,2)}</div>
      <div class="rank-score depois">${fmt(r.depois,2)}</div>
      <div class="rank-evolucao">+${fmt(r.evolucao,2)}</div>
      <div><span class="tag-nivel nivel-${slugNivel(r.nivelAntes)}">${r.nivelAntes}</span></div>
      <div><span class="tag-nivel nivel-${slugNivel(r.nivelDepois)}">${r.nivelDepois}</span></div>
    </div>`).join('');

  return `
  <!-- HEADER -->
  <div class="header-bloco">
    <div class="header-logo">ENEDES · Escola de Negócios e Desenvolvimento Social · IFB</div>
    <div class="header-title">Relatório de Maturidade Digital ABDI</div>
    <div class="header-sub">${turma ? 'Turma: ' + turma : 'Todas as turmas'} · Gerado em ${hoje}</div>
    <div class="header-badge">${imdIcon} IMD Projeto: ${fmt(m.imd,1)}% · Atingimento da Meta: ${fmt(m.atingimento,0)}%</div>
  </div>

    <div class="kpi-card azul">

      <div class="kpi-desc">Avaliados (ANTES)<br>${m.depois.length} responderam depois</div>
    </div>
    <div class="kpi-card verde">
      <div class="kpi-label">IMD Projeto</div>
      <div class="kpi-valor verde">${fmt(m.imd,1)}%</div>

    </div>

    </div>

      <div class="kpi-label">Mudaram de nível</div>

      <div class="kpi-desc">participantes com evolução<br>qualitativa de nível</div>
    </div>
    <div class="kpi-card verde">
      <div class="kpi-label">Evolução Média</div>
      <div class="kpi-valor verde">+${fmt(m.evMedia,2)}</div>
      <div class="kpi-desc">pontos por participante<br>${fmt(m.avgAntes,2)} → ${fmt(m.avgDepois,2)}</div>
    </div>
  </div>

  <!-- FÓRMULA ABDI -->
  <div class="secao">
    <div class="secao-titulo">📐 Fórmula ABDI — Cálculo Oficial</div>
    <div class="formula-card">
      <div class="formula-titulo">IMD_projeto = ((IMD_t − IMD_t-1) ÷ IMD_t-1) × 100</div>
      <div class="formula-box">IMD_projeto = (( ${fmt(m.avgDepois,2)} − ${fmt(m.avgAntes,2)} ) ÷ ${fmt(m.avgAntes,2)}) × 100 = <strong>${fmt(m.imd,2)}%</strong></div>
      <div class="formula-passos">
        <div class="passo">
          <div class="passo-num">Passo 1 · IMD_t-1</div>
          <div class="passo-val">${fmt(m.avgAntes,2)}</div>
          <div class="passo-desc">Índice Médio ANTES</div>
        </div>
        <div class="passo">
          <div class="passo-num">Passo 2 · IMD_t</div>
          <div class="passo-val">${fmt(m.avgDepois,2)}</div>
          <div class="passo-desc">Índice Médio DEPOIS</div>
        </div>
        <div class="passo">
          <div class="passo-num">Passo 3 · Diferença</div>
          <div class="passo-val">+${fmt(m.evMedia,2)}</div>
          <div class="passo-desc">IMD_t − IMD_t-1</div>
        </div>
        <div class="passo">
          <div class="passo-num">Passo 4 · Resultado</div>
          <div class="passo-val">${fmt(m.imd,2)}%</div>
          <div class="passo-desc">IMD_projeto final</div>
        </div>
      </div>
      <div class="resultado-abdi">
        <div>
          <div class="res-label">🎯 Meta ABDI: 30% de evolução</div>
          <div class="res-meta">Atingimento: ${fmt(m.atingimento,0)}% da meta${m.imd>=30 ? ' · Superada em +' + fmt(m.imd-30,2) + ' p.p.' : ''}</div>
        </div>
        <div class="res-val">${fmt(m.imd,1)}%</div>
      </div>
    </div>
  </div>

  <!-- COMPARATIVO SCORES -->
  <div class="secao">
    <div class="secao-titulo">📊 Comparativo de Scores</div>
    <div class="comp-grid">
      <div class="comp-card">
        <div class="comp-label">Score Médio — Antes</div>
        <div class="comp-antes">${fmt(m.avgAntes,2)}</div>
        <div class="comp-sub">pontos (escala 10–40)</div>
      </div>
      <div class="comp-card">
        <div class="comp-label">Score Médio — Depois</div>
        <div class="comp-depois">${fmt(m.avgDepois,2)}</div>
        <div class="comp-sub">pontos (escala 10–40)</div>
      </div>
      <div class="comp-card">
        <div class="comp-label">Evolução Média</div>
        <div class="comp-evolucao">+${fmt(m.evMedia,2)}</div>
        <div class="comp-sub">pontos por participante</div>
        <div class="arrow-evolucao">
          <span style="color:#ef4444;font-weight:700">${fmt(m.avgAntes,1)}</span>
          <span class="seta">→</span>
          <span style="color:#10b981;font-weight:700">${fmt(m.avgDepois,1)}</span>
        </div>
      </div>
    </div>
  </div>

  <!-- DIMENSÕES -->
  <div class="secao">
    <div class="secao-titulo">📏 Evolução por Dimensão</div>
    <div class="legenda">
      <div class="legenda-item"><div class="legenda-dot antes"></div> Antes</div>
      <div class="legenda-item"><div class="legenda-dot depois"></div> Depois</div>
    </div>
    <div class="barra-comp-wrap">${barrasRows}</div>
  </div>

  <!-- GRÁFICOS -->
  <div class="secao">
    <div class="secao-titulo">📈 Visualizações</div>
    <div class="charts-grid">
      <div class="chart-card">
        <div class="chart-titulo">Radar — Dimensões Antes × Depois</div>
        <div class="chart-wrap"><canvas id="chartRadar"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-titulo">Distribuição de Níveis</div>
        <div class="chart-wrap"><canvas id="chartNiveis"></canvas></div>
      </div>
    </div>
  </div>

  <!-- TRANSFORMAÇÃO DE NÍVEIS -->
  <div class="secao">
    <div class="secao-titulo">🎯 Transformação de Níveis de Maturidade</div>
    <div class="niveis-grid">${niveisRows}</div>
  </div>

  <!-- CONQUISTAS -->
  <div class="secao">
    <div class="secao-titulo">✅ Principais Conquistas e Impactos</div>
    <div class="conquistas-grid">
      <div class="conquista-item">
        <div class="conquista-icon">🏆</div>
        <div class="conquista-text"><strong>IMD Projeto: ${fmt(m.imd,2)}%</strong> — ${m.imd>=30?'Meta ABDI superada ('+fmt(m.atingimento,0)+'% de atingimento)':'Próximo da meta ABDI de 30%'}</div>
      </div>
      <div class="conquista-item">
        <div class="conquista-icon">👥</div>
        <div class="conquista-text"><strong>${m.antes.length} participantes</strong> analisados com avaliação antes e depois da formação</div>
      </div>
      <div class="conquista-item">
        <div class="conquista-icon">📈</div>
        <div class="conquista-text"><strong>${m.mudaram} empreendedores</strong> (${m.antes.length>0?((m.mudaram/m.antes.length)*100).toFixed(1):0}%) mudaram de nível de maturidade digital</div>

      <div class="conquista-item">
        <div class="conquista-icon">⭐</div>
        <div class="conquista-text">Evolução média de <strong>+${fmt(m.evMedia,2)} pontos</strong> por participante (de ${fmt(m.avgAntes,2)} para ${fmt(m.avgDepois,2)})</div>
      </div>
      ${m.rankList.length ? `
      <div class="conquista-item">
        <div class="conquista-icon">🥇</div>
        <div class="conquista-text">Maior evolução individual: <strong>+${fmt(m.rankList[0].evolucao,2)} pontos</strong> — ${m.rankList[0].nome}</div>
      </div>` : ''}
      <div class="conquista-item">
        <div class="conquista-icon">🔬</div>
        <div class="conquista-text">Score médio aumentou <strong>${fmt(m.evMedia,2)} pontos</strong> (de ${fmt(m.avgAntes,2)} para ${fmt(m.avgDepois,2)})</div>
      </div>
    </div>
  </div>

  <!-- RANKING -->
  <div class="secao">
    <div class="secao-titulo">🏆 Ranking — Top ${Math.min(20, m.rankList.length)} Participantes por Evolução</div>
    <div class="ranking-card">
      <div class="ranking-header">
        <div>#</div><div>Nome</div><div>Antes</div><div>Depois</div><div>Evolução</div>
        <div>Nível Antes</div><div>Nível Depois</div>
      </div>
      ${rankRows || '<div style="padding:20px;text-align:center;color:var(--cinza-m)">Sem dados pareados suficientes</div>'}
    </div>
  </div>

  <!-- METODOLOGIA -->
  <div class="secao">
    <div class="secao-titulo">📋 Metodologia e Critérios</div>
    <div class="metod-card">
      <div class="metod-grid">
        <div class="metod-item"><div class="metod-label">Critério de Pontuação</div><div class="metod-val">10 perguntas sobre práticas digitais, cada resposta de 1 a 4 pontos</div></div>
        <div class="metod-item"><div class="metod-label">Score Individual</div><div class="metod-val">Soma dos pontos das 10 perguntas (range: 10–40)</div></div>
        <div class="metod-item"><div class="metod-label">IMD (Índice Médio)</div><div class="metod-val">Média dos scores de todos os participantes</div></div>
        <div class="metod-item"><div class="metod-label">Fórmula ABDI</div><div class="metod-val">IMD_projeto = ((IMD_t − IMD_t-1) ÷ IMD_t-1) × 100</div></div>
        <div class="metod-item"><div class="metod-label">Meta ABDI</div><div class="metod-val">30% de evolução no IMD entre início e fim da formação</div></div>

  </div>`;
}

let charts = {};
function renderCharts(m) {
  // destroi charts anteriores
  Object.values(charts).forEach(c => c && c.destroy && c.destroy());
  charts = {};

  // Radar
  const ctxR = document.getElementById('chartRadar');
  if (ctxR) {
    charts.radar = new Chart(ctxR, {
      type: 'radar',
      data: {
        labels: DIMS_NOMES,
        datasets: [
          { label: 'Antes', data: m.avgDimAntes.map(v=>+v.toFixed(2)),
            borderColor: '#ef4444', backgroundColor: 'rgba(239,68,68,.15)',
            pointBackgroundColor: '#ef4444', pointRadius: 4, borderWidth: 2 },
          { label: 'Depois', data: m.avgDimDepois.map(v=>+v.toFixed(2)),
            borderColor: '#10b981', backgroundColor: 'rgba(16,185,129,.15)',
            pointBackgroundColor: '#10b981', pointRadius: 4, borderWidth: 2 },
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: { r: { min: 0, max: 8, ticks: { stepSize: 2, font: { size: 10 } },
          pointLabels: { font: { size: 11, weight: 'bold' } } } },
        plugins: { legend: { position: 'bottom', labels: { font: { size: 11 } } } }
      }
    });
  }

  // Níveis agrupado
  const ctxN = document.getElementById('chartNiveis');
  if (ctxN) {
    charts.niveis = new Chart(ctxN, {
      type: 'bar',
      data: {
        labels: NIVEIS_NOMES.map(n => n.replace(' ','<br>')),
        datasets: [
          { label: 'Antes',  data: m.distAntes,  backgroundColor: 'rgba(239,68,68,.75)',  borderRadius: 4 },
          { label: 'Depois', data: m.distDepois, backgroundColor: 'rgba(16,185,129,.75)', borderRadius: 4 },
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom', labels: { font: { size: 11 } } } },
        scales: {
          x: { ticks: { font: { size: 9 } } },
          y: { beginAtZero: true, ticks: { stepSize: 1 } }
        }
      }
    });
  }
}
